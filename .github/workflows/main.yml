name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -oq VoiceControl.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: VoiceControl
        run: |
          for i in 1 2 3 4; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Попытка $i не удалась, жду 60 секунд..."
            sleep 60
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-debug
          path: VoiceControl/app/build/outputs/apk/debug/*.apk
